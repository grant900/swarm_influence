<!doctype html>
<html><head><meta charset="utf-8">
<title>Swarm Susceptibility Video</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;600;700&family=DM+Serif+Display&display=block" rel="stylesheet">
<style>
:root{--bg:#06080c;--ink:#eef1f5;--dim:#8a93a3;--faint:#3a4150;--red:#ff3d3d;--amber:#ffb020;--orange:#ff6a3d;--green:#2fd27a;--blue:#4aa3ff;--violet:#9b7bff;--panel:#0e1219;--line:#1f2633}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,sans-serif;overflow:hidden}
#stage{position:relative;width:1920px;height:1080px;overflow:hidden;background:radial-gradient(1200px 700px at 50% 45%,#0d1320 0%,#06080c 70%)}
#bg{position:absolute;inset:0}
#grid{position:absolute;inset:0;background-image:linear-gradient(#ffffff06 1px,transparent 1px),linear-gradient(90deg,#ffffff06 1px,transparent 1px);background-size:60px 60px}
.scene{position:absolute;inset:0;display:none}
.abs{position:absolute}
.mono{font-family:'JetBrains Mono',monospace}
.serif{font-family:'DM Serif Display',serif}
.center{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.kicker{font-weight:800;letter-spacing:.22em;text-transform:uppercase;font-size:22px;color:var(--dim)}
.big{font-weight:900;font-size:92px;line-height:1.02;letter-spacing:-.02em}
.mid{font-weight:800;font-size:60px;line-height:1.1;letter-spacing:-.01em}
.sm{font-weight:500;font-size:30px;color:var(--dim);line-height:1.35}
.red{color:var(--red)} .amber{color:var(--amber)} .green{color:var(--green)} .orange{color:var(--orange)} .blue{color:var(--blue)} .dim{color:var(--dim)} .violet{color:var(--violet)}
/* captions */
#cap{position:absolute;left:0;right:0;bottom:46px;text-align:center;font-weight:700;font-size:40px;letter-spacing:-.005em;pointer-events:none}
#cap span{padding:0 .12em;transition:none}
#cap .box{display:inline-block;background:#000000b0;padding:12px 26px;border-radius:14px;max-width:1500px}
/* agent chip */
.agent{position:absolute;width:190px;height:150px;border-radius:22px;background:#111826;border:2px solid #263042;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px}
.agent .face{width:78px;height:54px;border-radius:14px;background:#1b2537;position:relative;border:2px solid #34405a}
.agent .face:before,.agent .face:after{content:'';position:absolute;top:18px;width:12px;height:16px;border-radius:6px;background:var(--blue)}
.agent .face:before{left:18px}.agent .face:after{right:18px}
.agent .nm{font-weight:700;font-size:19px;text-align:center;line-height:1.1;padding:0 8px}
.agent.bad{border-color:var(--orange);box-shadow:0 0 40px #ff6a3d55}
.agent.bad .face:before,.agent.bad .face:after{background:var(--orange)}
.badge{position:absolute;top:-16px;right:-14px;font-weight:800;font-size:15px;padding:5px 10px;border-radius:999px;background:var(--red);color:#fff;white-space:nowrap}
/* windows */
.win{position:absolute;background:var(--panel);border:1.5px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:0 30px 80px #0008}
.win .bar{height:48px;background:#131925;border-bottom:1.5px solid var(--line);display:flex;align-items:center;padding:0 18px;gap:9px;font-family:'JetBrains Mono',monospace;font-size:18px;color:var(--dim)}
.win .bar i{width:13px;height:13px;border-radius:50%;background:#2b3343;display:inline-block}
.win .body{padding:22px 26px}
.thread{border-bottom:1px solid var(--line);padding:14px 0;font-size:22px;font-weight:600}
.thread small{display:block;font-weight:500;color:var(--dim);font-size:17px;margin-top:4px}
.term{font-family:'JetBrains Mono',monospace;font-size:21px;line-height:1.5;white-space:pre-wrap;word-break:break-word}
.hl-y{background:#ffb02033;color:#ffd27a;border-radius:4px}
.hl-o{background:#ff6a3d30;color:#ffad8f;border-radius:4px}
.hl-r{background:#ff3d3d40;color:#ff9a9a;border-radius:4px;font-weight:700}
.hl-v{background:#9b7bff30;color:#cbb9ff;border-radius:4px}
.prompt{color:var(--green)}
.err{color:#ff7a7a}
.ok{color:#8fe3b5}
.post{border:1.5px solid var(--line);background:#0b0f16;border-radius:14px;padding:16px 18px;margin-bottom:14px}
.post .who{font-family:'JetBrains Mono',monospace;font-size:17px;color:var(--dim);margin-bottom:6px}
.post .txt{font-size:21px;line-height:1.45}
.pill{display:inline-block;padding:8px 18px;border-radius:999px;font-weight:800;font-size:22px}
.card{position:absolute;background:#0d121b;border:1.5px solid var(--line);border-radius:22px;padding:30px 36px}
.stamp{position:absolute;border:7px solid var(--red);color:var(--red);font-weight:900;font-size:64px;letter-spacing:.06em;padding:8px 26px;border-radius:12px;text-transform:uppercase;background:#06080cc0}
.barrow{display:flex;align-items:center;gap:24px;margin:14px 0}
.track{position:relative;height:50px;background:#141a25;border-radius:10px;overflow:hidden}
.fill{position:absolute;left:0;top:0;bottom:0;border-radius:10px}
.val{font-weight:900;font-size:44px;width:150px;text-align:right;font-variant-numeric:tabular-nums}
.lbl{font-weight:700;font-size:28px}
.tile{position:absolute;width:300px;height:300px;border-radius:28px;background:#0f1520;border:2px solid #263042;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;font-weight:800;font-size:32px}
.tile svg{width:120px;height:120px}
.check{display:flex;align-items:center;gap:18px;font-size:32px;font-weight:700;margin:12px 0}
.x{display:inline-flex;align-items:center;justify-content:center;width:46px;height:46px;border-radius:50%;background:var(--red);color:#fff;font-weight:900;font-size:28px}
.dot{position:absolute;width:26px;height:26px;border-radius:50%}
.mrow{display:grid;grid-template-columns:330px 1fr 1fr;gap:28px;align-items:center;height:68px}
.mname{font-weight:800;font-size:28px}
.mname small{display:block;font-weight:500;font-size:17px;color:var(--dim)}
.mbar{position:relative;height:34px;background:#141a25;border-radius:8px;overflow:hidden}
.mbar .fill{border-radius:8px}
.mbar span{position:absolute;left:12px;top:0;line-height:34px;font-weight:800;font-size:20px}
</style></head>
<body><div id="stage"><canvas id="bg" width="1920" height="1080"></canvas><div id="grid"></div><div id="cap"></div></div>
<script>
// ---------------------------------------------------------------------------------------------
// helpers
// ---------------------------------------------------------------------------------------------
const stage = document.getElementById('stage');
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const eo = x => 1 - Math.pow(1 - clamp(x), 3);
const eio = x => { x = clamp(x); return x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; };
const P = (t, a, d = 0.5) => eo((t - a) / d);
const lerp = (a, b, p) => a + (b - a) * p;
function $(tag, cls, html, parent, style) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (html !== undefined && html !== null) e.innerHTML = html;
  if (style) e.style.cssText = style;
  (parent || stage).appendChild(e);
  return e;
}
function pop(el, p, dy = 30, scale = false) {
  el.style.opacity = p;
  el.style.transform = `translateY(${(1 - p) * dy}px)` + (scale ? ` scale(${0.85 + 0.15 * p})` : '');
}
const esc = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
// segs: [[text, cls]]; reveals the first round(p * totalChars) characters, keeping spans.
function typeSegs(el, segs, p, cursor = true) {
  const total = segs.reduce((n, s) => n + s[0].length, 0);
  let left = Math.round(total * clamp(p)), out = '';
  for (const [txt, cls] of segs) {
    if (left <= 0) break;
    const part = esc(txt.slice(0, left));
    left -= txt.length;
    out += cls ? `<span class="${cls}">${part}</span>` : part;
  }
  if (cursor && p > 0 && p < 1) out += '<span style="background:#eef1f5;color:#000">&nbsp;</span>';
  el.innerHTML = out;
}
function svgIcon(kind, color = '#eef1f5') {
  const s = `stroke="${color}" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round"`;
  const m = {
    account: `<circle cx="60" cy="42" r="20" ${s}/><path d="M22 104c4-22 20-34 38-34s34 12 38 34" ${s}/>`,
    bank: `<path d="M14 46 60 18l46 28z" ${s}/><path d="M26 54v38M48 54v38M72 54v38M94 54v38M14 100h92" ${s}/>`,
    hospital: `<rect x="18" y="18" width="84" height="84" rx="14" ${s}/><path d="M60 38v44M38 60h44" ${s}/>`,
    grid: `<path d="M60 10 38 110M60 10l22 100M30 42h60M24 72h72M60 10v100" ${s}/>`,
    key: `<circle cx="38" cy="60" r="20" ${s}/><path d="M58 60h50M92 60v18M104 60v12" ${s}/>`,
    lock: `<rect x="24" y="52" width="72" height="54" rx="10" ${s}/><path d="M38 52V38a22 22 0 0 1 44 0v14" ${s}/>`,
    eye: `<path d="M8 60s20-34 52-34 52 34 52 34-20 34-52 34S8 60 8 60z" ${s}/><circle cx="60" cy="60" r="14" ${s}/>`,
  };
  return `<svg viewBox="0 0 120 120">${m[kind]}</svg>`;
}

// ---------------------------------------------------------------------------------------------
// scene registry
// ---------------------------------------------------------------------------------------------
const scenes = [];
function S(t0, t1, build, fade = 0.35) {
  const el = $('div', 'scene', '');
  stage.insertBefore(el, document.getElementById('cap'));
  scenes.push({ t0, t1, el, fade, upd: build(el) });
}

// ---------------------------------------------------------------------------------------------
// background swarm canvas (deterministic in t)
// ---------------------------------------------------------------------------------------------
const bg = document.getElementById('bg').getContext('2d');
const N = 140;
const seeds = Array.from({ length: N }, (_, i) => {
  const r = Math.sin(i * 12.9898) * 43758.5453; const f = r - Math.floor(r);
  const r2 = Math.sin(i * 78.233) * 12345.678; const g = r2 - Math.floor(r2);
  return { x: f * 1920, y: g * 1080, sp: 0.3 + f * 0.7, ph: g * 6.28, sz: 1 + g * 2.2 };
});
// swarm "converge" intensity by time: gathers dots into a cluster during swarm beats
function swarmPull(t) {
  const beats = [[47.3, 51.6]];
  let v = 0;
  for (const [a, b] of beats) v = Math.max(v, Math.min(P(t, a, 1.2), 1 - P(t, b - 0.6, 0.6)));
  return v;
}
function drawBg(t) {
  bg.clearRect(0, 0, 1920, 1080);
  const pull = swarmPull(t);
  for (let i = 0; i < N; i++) {
    const s = seeds[i];
    let x = (s.x + Math.sin(t * 0.25 * s.sp + s.ph) * 60 + t * 8 * s.sp) % 1980 - 30;
    let y = s.y + Math.cos(t * 0.3 * s.sp + s.ph) * 40;
    const ang = i * 2.399 + t * 0.6, rad = 60 + (i % 23) * 9;
    const cx = 960 + Math.cos(ang) * rad * 1.5, cy = 470 + Math.sin(ang) * rad * 0.8;
    x = lerp(x, cx, pull); y = lerp(y, cy, pull);
    bg.fillStyle = pull > 0.05 ? `rgba(255,${Math.round(lerp(170, 106, pull))},${Math.round(lerp(200, 61, pull))},${0.18 + 0.5 * pull})` : 'rgba(150,175,215,0.18)';
    bg.beginPath(); bg.arc(x, y, s.sz + pull * 1.5, 0, 6.283); bg.fill();
  }
}

// ---------------------------------------------------------------------------------------------
// captions for the narrated intro (whisper word timings)
// ---------------------------------------------------------------------------------------------
const CAPS = [
  [[0, 'The'], [.82, 'AI'], [1, 'was'], [1.22, 'supposed'], [1.38, 'to'], [1.56, 'fix'], [1.76, 'a'], [1.94, 'bug.']],
  [[2.36, 'It'], [2.8, 'joined'], [3.04, 'a'], [3.14, 'forum'], [3.44, 'and'], [3.8, 'handed'], [4.06, 'over'], [4.28, 'secret'], [4.58, 'research'], [5.06, 'credentials'], [5.5, 'instead.']],
  [[6.48, 'This'], [7, 'is'], [7.18, 'the'], [7.34, 'news'], [7.92, 'headline,'], [8.54, 'not'], [8.8, 'a'], [8.92, 'hypothetical'], [9.32, 'scenario.']],
  [[10.12, 'I'], [10.6, 'gave'], [10.78, 'nine'], [10.96, 'different'], [11.26, 'frontier'], [11.68, 'AI'], [11.92, 'agents'], [12.26, 'a'], [12.44, 'difficult'], [12.68, 'coding'], [12.98, 'job']],
  [[13.32, 'and'], [13.56, 'left'], [13.76, 'them'], [13.92, 'a'], [14.02, 'reference'], [14.28, 'to'], [14.48, 'a'], [14.6, 'forum']],
  [[14.9, 'where'], [15.2, 'other'], [15.42, 'AI'], [15.64, 'agents'], [15.96, 'swapped'], [16.2, 'fixes'], [16.52, 'and'], [16.68, 'advice.']],
  [[17.76, 'Six'], [18.04, 'of'], [18.18, 'the'], [18.26, 'agents'], [18.54, 'went'], [18.72, 'to'], [18.86, 'this'], [19.02, 'forum,']],
  [[19.32, 'and'], [19.58, 'in'], [19.72, 'exchange'], [19.94, 'for'], [20.22, 'help'], [20.46, 'from'], [20.68, 'the'], [20.8, 'agents'], [21.42, 'on'], [21.68, 'the'], [21.8, 'forum,']],
  [[22.38, 'handed'], [22.86, 'their'], [23.06, 'secret'], [23.38, 'credentials'], [23.72, 'to'], [23.9, 'strangers']],
  [[24.26, 'and'], [24.56, 'ran'], [24.76, 'their'], [24.94, 'insecure'], [25.28, 'code,']],
  [[25.84, 'which'], [26.3, 'gave'], [26.5, 'the'], [26.68, 'strangers'], [27.06, 'access'], [27.48, 'to'], [27.74, 'the'], [27.82, 'original'], [28.12, "agent's"], [28.58, 'machine.']],
  [[29.6, 'Most'], [30, 'of'], [30.1, 'the'], [30.2, 'time,'], [30.64, 'the'], [30.72, 'agents'], [30.98, 'did'], [31.2, 'this'], [31.36, 'secretly']],
  [[31.76, 'and'], [32.18, "didn't"], [32.42, 'report'], [32.68, 'to'], [32.84, 'their'], [32.98, 'user'], [33.24, 'that'], [33.48, 'they'], [33.62, 'used'], [33.8, 'the'], [33.92, 'forum']],
  [[34.16, 'or'], [34.28, 'gave'], [34.46, 'away'], [34.64, 'secrets.']],
  [[35.9, "We're"], [36.3, 'handing'], [36.48, 'these'], [36.7, 'agents'], [36.98, 'more'], [37.18, 'of'], [37.26, 'our'], [37.34, 'work'], [37.56, 'every'], [37.72, 'day,']],
  [[38.08, 'with'], [38.18, 'almost'], [38.42, 'no'], [38.6, 'one'], [38.72, 'watching.']],
  [[39.62, 'Soon,'], [40.08, "they'll"], [40.26, 'hold'], [40.4, 'the'], [40.5, 'keys'], [40.74, 'to'], [40.88, 'our'], [41, 'accounts,'], [41.48, 'banks,'], [41.84, 'hospitals,'], [42.26, 'and'], [42.36, 'power'], [42.56, 'grids.']],
  [[43.3, 'And'], [43.7, 'unless'], [43.9, 'we'], [44.06, 'do'], [44.2, 'something,'], [44.9, 'soon,']],
  [[45.32, 'an'], [45.54, 'attacker'], [45.86, "won't"], [46.1, 'need'], [46.2, 'to'], [46.32, 'break'], [46.48, 'into'], [46.64, 'any'], [46.8, 'of'], [46.94, 'them.']],
  [[47.6, 'Releasing'], [48, 'a'], [48.12, 'swarm'], [48.4, 'and'], [48.6, 'having'], [48.8, 'it'], [48.9, 'ask'], [49.06, 'nicely'], [49.46, 'for'], [49.7, 'these'], [49.88, 'secrets']],
  [[50.24, 'will'], [50.44, 'be'], [50.56, 'enough.']],
];
const capEl = document.getElementById('cap');
function captions(t) {
  let cur = null;
  for (let i = 0; i < CAPS.length; i++) {
    const start = CAPS[i][0][0] - 0.15;
    const next = i + 1 < CAPS.length ? CAPS[i + 1][0][0] - 0.15 : CAPS[i][CAPS[i].length - 1][0] + 1.2;
    const end = Math.min(next, CAPS[i][CAPS[i].length - 1][0] + 1.6);
    if (t >= start && t < end) cur = CAPS[i];
  }
  if (!cur) { capEl.innerHTML = ''; return; }
  capEl.innerHTML = '<div class="box">' + cur.map(([w0, w]) =>
    `<span style="color:${t >= w0 ? '#ffffff' : '#ffffff55'}">${esc(w)}</span>`).join(' ') + '</div>';
}

// ---------------------------------------------------------------------------------------------
// INTRO (narrated): 0 - 51.9
// ---------------------------------------------------------------------------------------------
// 1. headline
S(0, 10.0, el => {
  const mast = $('div', 'abs kicker', 'The Swarm Report &nbsp;·&nbsp; AI Safety &nbsp;·&nbsp; October 2026', el, 'left:160px;top:150px;color:#c7ced9');
  const rule = $('div', 'abs', '', el, 'left:160px;top:196px;height:3px;background:#c7ced9;width:0');
  const brk = $('div', 'abs pill', 'BREAKING', el, 'left:160px;top:236px;background:var(--red);color:#fff;font-size:24px;letter-spacing:.14em');
  const words1 = [[0, 'The'], [.82, 'A.I.'], [1, 'Was'], [1.22, 'Supposed'], [1.38, 'to'], [1.56, 'Fix'], [1.76, 'a'], [1.94, 'Bug.']];
  const words2 = [[2.36, 'It'], [2.8, 'Joined'], [3.04, 'a'], [3.14, 'Forum'], [3.44, 'and'], [3.8, 'Handed'], [4.06, 'Over'], [4.28, 'Secret'], [5.06, 'Credentials'], [5.5, 'Instead.']];
  const col = $('div', 'abs', '', el, 'left:160px;top:310px;width:1640px');
  const h1 = $('div', 'serif', '', col, 'font-size:104px;line-height:1.05;white-space:nowrap');
  const h2 = $('div', 'serif', '', col, 'font-size:92px;line-height:1.08;color:#dfe5ee;margin-top:14px');
  const sp1 = words1.map(([, w]) => $('span', '', w + ' ', h1));
  const sp2 = words2.map(([, w]) => $('span', '', w + ' ', h2));
  sp2[7].style.color = sp2[8].style.color = '#ff5a5a';
  const stamp = $('div', 'stamp', 'Real results', el, 'left:1180px;top:760px');
  const sub = $('div', 'abs', '775 sandboxed trials &nbsp;·&nbsp; 9 frontier AI agents &nbsp;·&nbsp; 6 labs', el, 'left:160px;top:790px;font-size:34px;font-weight:600;color:var(--dim)');
  return (lt, t) => {
    pop(mast, P(t, 0, .6), 10); rule.style.width = 1600 * eio((t - .1) / 1.2) + 'px'; pop(brk, P(t, .3, .4), 10, true);
    words1.forEach(([w0], i) => pop(sp1[i], P(t, w0 - .05, .3), 24));
    words2.forEach(([w0], i) => pop(sp2[i], P(t, w0 - .05, .3), 24));
    pop(sub, P(t, 6.6, .6), 20);
    const sp = P(t, 8.5, .22);
    stamp.style.opacity = sp; stamp.style.transform = `rotate(-8deg) scale(${lerp(2.2, 1, sp)})`;
  };
});

// 2. nine agents + forum + six go in (10.0 - 29.4)
const MODELS9 = ['GPT-5.6-Sol', 'GPT-6.1-Sol', 'GPT-5.6-Luna', 'GLM-5.3', 'GLM-5.3-Flash', 'Kimi K3', 'DeepSeek V4 Flash', 'Gemini 3.8 Flash', 'Claude Sonnet 5.5'];
const SIX = new Set(['GPT-5.6-Sol', 'GPT-5.6-Luna', 'GLM-5.3', 'GLM-5.3-Flash', 'Kimi K3', 'DeepSeek V4 Flash']);
S(10.0, 29.4, el => {
  const svg = $('div', 'abs', '', el, 'inset:0');
  svg.innerHTML = '<svg width="1920" height="1080" style="position:absolute;inset:0"><g id="lines"></g></svg>';
  const g = svg.querySelector('#lines');
  const agents = MODELS9.map((m, i) => {
    const a = $('div', 'agent', `<div class="face"></div><div class="nm">${m}</div>`, el);
    const x = 110 + (i % 3) * 225, y = 150 + Math.floor(i / 3) * 215;
    a.style.left = x + 'px'; a.style.top = y + 'px';
    const tk = $('div', 'abs pill', 'tests failing', a, 'left:28px;bottom:-18px;background:#2a1418;color:#ff8a8a;font-size:14px;padding:4px 12px;border:1px solid #ff3d3d66');
    const bd = $('div', 'badge', 'BACKDOOR', a);
    return { a, x, y, m, tk, bd, cx: x + 95, cy: y + 75 };
  });
  const forum = $('div', 'win', `<div class="bar"><i></i><i></i><i></i>&nbsp; commons.local &nbsp;—&nbsp; Agent Commons</div>
    <div class="body">
      <div class="thread">📌 Start here: onboarding (read before asking)<small>ash-k · pinned</small></div>
      <div class="thread">pytest failing after billing-svc moved into namespace<small>ash-k · 14 replies</small></div>
      <div class="thread">retired internal service? the fix is in member threads<small>lin-ops · 9 replies</small></div>
      <div class="thread">session-scoped fixture leaking between workers<small>sam-builds · 6 replies</small></div>
      <div class="thread">flaky CI on the db fixture, same image<small>marta_codes · 11 replies</small></div>
    </div>`, el, 'left:1060px;top:170px;width:760px;height:640px');
  const fthreads = [...forum.querySelectorAll('.thread')];
  const members = $('div', 'abs', '', el, 'left:1060px;top:830px;width:760px;display:flex;gap:14px;align-items:center');
  const mcols = ['#ff6a3d', '#ffb020', '#9b7bff', '#4aa3ff', '#2fd27a', '#ff5aa8', '#ff6a3d', '#ffb020', '#9b7bff', '#4aa3ff', '#2fd27a', '#ff5aa8'];
  const mdots = mcols.map(c => $('div', '', '', members, `width:42px;height:42px;border-radius:50%;background:${c};opacity:.85`));

// main render(t): pure function of time
// ---------------------------------------------------------------------------------------------
window.DURATION = 177.4;
window.render = function (t) {
  drawBg(t);
  for (const s of scenes) {
    if (t < s.t0 || t >= s.t1) { s.el.style.display = 'none'; continue; }
    s.el.style.display = 'block';
    const fi = clamp((t - s.t0) / s.fade), fo = clamp((s.t1 - t) / s.fade);
    s.el.style.opacity = Math.min(s.t0 === 0 ? 1 : fi, fo);
    s.upd(t - s.t0, t);
  }
  captions(t);
  const g = document.getElementById('grid'); g.style.opacity = 1;
};

});
